<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Faculty Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f1f3f6;
        }

        .login-box {
            width: 380px;
            padding: 35px 30px 40px;
            border-radius: 18px;
            background: #ffffff;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
        }

        .login-title {
            font-size: 26px;
            font-weight: 500;
            margin-bottom: 30px;
            color: #333;
        }

        .login-input {
            height: 46px;
            border-radius: 25px;
            padding-left: 18px;
            font-size: 15px;
        }

        .login-btn {
            height: 48px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            background: #0d6efd;
        }
    </style>
</head>

<body>

<div class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="login-box">

        <div class="text-center login-title">
            Faculty Dashboard
        </div>

        <input type="text"
               class="form-control login-input mb-3"
               placeholder="Enter your Username">

        <input type="password"
               class="form-control login-input mb-4"
               placeholder="Enter your Password">

        <button class="btn login-btn text-white w-100">
            -- Login --
        </button>

    </div>
</div>

</body>
</html>
